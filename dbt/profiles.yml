# profile local. em portfolio deixo aqui no repo pra facilitar rodar;
# num projeto de verdade isso ficaria em ~/.dbt/profiles.yml com env_var.
frota_brasil:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      dbname: "{{ env_var('PGDATABASE', 'frota') }}"
      user: "{{ env_var('PGUSER', 'frota') }}"
      password: "{{ env_var('PGPASSWORD', 'frota') }}"
      schema: analytics
      threads: 4

    # Alvo da migracao pro BigQuery. Os models ja saem particionados por mes e
    # clusterizados por marca/modelo_base quando target.type == 'bigquery' -
    # ver o config no topo das duas marts e docs/bigquery.md pro porque.
    #
    # NAO esta em producao: nao ha projeto GCP neste repo. Roda com
    #   dbt run --target bq
    # depois de `gcloud auth application-default login` e de setar GCP_PROJECT.
    bq:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'frota-brasil') }}"
      dataset: "{{ env_var('BQ_DATASET', 'analytics') }}"
      location: "{{ env_var('BQ_LOCATION', 'southamerica-east1') }}"
      threads: 8
      priority: interactive
