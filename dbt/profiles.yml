# Fica no repo para rodar sem configurar nada; credenciais vêm do ambiente.
frota_brasil:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      dbname: "{{ env_var('PGDATABASE', 'frota') }}"
      user: "{{ env_var('PGUSER', 'frota') }}"
      password: "{{ env_var('PGPASSWORD', 'frota') }}"
      schema: analytics
      threads: 4

    # dbt run --target bq, depois de `gcloud auth application-default login`
    bq:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: "{{ env_var('BQ_DATASET', 'analytics') }}"
      location: "{{ env_var('BQ_LOCATION', 'southamerica-east1') }}"
      threads: 8
      priority: interactive
