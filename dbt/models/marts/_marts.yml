version: 2

models:
  - name: mart_frota_municipio
    description: Frota de carros por marca, modelo_base, ano, UF, município e mês.
    columns:
      - name: marca
        tests: [not_null]
      - name: modelo_base
        tests: [not_null]
      - name: ano
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1900
              max_value: "{{ ano_max() }}"
      - name: qtd_veiculos
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
      # mês com nome fora do padrão vira null aqui e cairia numa partição sem data
      - name: mes_data
        tests: [not_null]

  - name: mart_consolidada
    description: Frota nacional x specs FIPE, por marca, modelo_base, ano e mês.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [marca, modelo_base, ano, mes_referencia]
    columns:
      - name: qtd_veiculos
        tests: [not_null]
      - name: mes_data
        tests: [not_null]
      - name: potencia_cv_mediana
        tests:
          - dbt_utils.accepted_range:
              min_value: 20
              max_value: 1000
              config:
                where: "potencia_cv_mediana is not null"
