name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: frota
          POSTGRES_USER: frota
          POSTGRES_PASSWORD: frota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frota"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: frota
      PGUSER: frota
      PGPASSWORD: frota

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # dbt-core 1.8 não roda no 3.13
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: dependências
        run: pip install -r requirements.txt -r requirements-pyspark.txt -r requirements-bigquery.txt -r requirements-dev.txt

      - name: lint, tipos e testes python (inclui o conversor Spark)
        run: make check

      - name: pipeline na amostra (load + dbt run + dbt test com unitários)
        env:
          USE_SAMPLE: "1"
        run: make load dbt test

      - name: target BigQuery compila
        working-directory: dbt
        env:
          GCP_PROJECT: ci-parse
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        run: dbt parse --target bq
