name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: frota
          POSTGRES_USER: frota
          POSTGRES_PASSWORD: frota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frota"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: frota
      PGUSER: frota
      PGPASSWORD: frota
      # absoluto de proposito: o step de deps+parse muda pra working-directory
      # dbt, e um caminho relativo aqui resolveria contra esse cwd (dbt/dbt),
      # nao contra a raiz do checkout.
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # dbt-core 1.8 nao roda no 3.13+, entao trava no 3.11
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          # pyspark 3.5 roda em 8/11/17 - 17 e o LTS atual, sem motivo pra
          # travar numa versao mais velha so no CI (o Windows de dev usa 8).
          distribution: temurin
          java-version: "17"

      - name: install deps
        run: |
          pip install -r requirements.txt
          pip install -r requirements-pyspark.txt

      - name: smoke test - conversao parquet via pyspark
        env:
          USE_SAMPLE: "1"
        run: |
          python -m pipeline.to_parquet_spark --mes abril_2026
          python -c "
          import pyarrow.dataset as ds
          n = ds.dataset('data/raw/frota_municipio_abril_2026.parquet', format='parquet').count_rows()
          assert n == 75000, f'esperava 75000 linhas na amostra, veio {n}'
          print('smoke test ok:', n, 'linhas')
          "

      - name: dbt deps + parse
        working-directory: dbt
        run: |
          dbt deps
          dbt parse

      # roda o pipeline completo na amostra e valida com dbt test.
      # so o schema raw precisa dos loads em python antes do dbt.
      - name: load sample + build + test
        env:
          USE_SAMPLE: "1"
        run: |
          python -m pipeline.load_frota
          python -m pipeline.load_fipe
          cd dbt
          dbt seed
          dbt run
          dbt test
